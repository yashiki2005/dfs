name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gmp
          echo "CFLAGS=-I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run pytest
        run: uv run --extra test pytest -q --timeout=120 tests

  package:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.12 .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/dfs-*.whl
          DFS_LANG=fr .wheel-venv/bin/python -c 'from dfs.i18n import _; key="巻き戻しを検出しました（B6）"; assert _(key) != key'
          .wheel-venv/bin/dfscli --help >/dev/null
          .wheel-venv/bin/dfssvc --help >/dev/null
