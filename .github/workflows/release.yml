name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.1.0"
      build_binaries:
        description: "Also build standalone binaries"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || inputs.build_binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            archive: tar.gz
            ext: ""
          - os: ubuntu-22.04
            target: linux-x86_64
            archive: tar.gz
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive: tar.gz
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            archive: zip
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          auto-activate-base: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install runtime (with libp2p via Miniconda) and PyInstaller
        shell: bash -l {0}
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            conda install -y -c conda-forge gmp
          fi
          PY_BIN="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --python "$PY_BIN" pyinstaller
          if ! uv pip install --python "$PY_BIN" --overrides fastecdsa-overrides.txt ".[libp2p]"; then
            echo "[release] libp2p extra failed on ${{ matrix.target }}; falling back to core dependencies" >&2
            uv pip install --python "$PY_BIN" .
          fi

      - name: Build standalone binaries
        shell: bash -l {0}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then DATA_SEP=";"; else DATA_SEP=":"; fi
          EXTRA_ARGS=()
          if python -c "import libp2p" 2>/dev/null; then
            EXTRA_ARGS+=(--collect-submodules libp2p --collect-submodules multiaddr)
          fi
          python -m PyInstaller --onefile --clean --name dfs \
            --add-data "dfs/i18n/catalogs.json${DATA_SEP}dfs/i18n" \
            "${EXTRA_ARGS[@]}" \
            scripts/pyinstaller_dfs.py
          python -m PyInstaller --onefile --clean --name dfscli \
            --add-data "dfs/i18n/catalogs.json${DATA_SEP}dfs/i18n" \
            "${EXTRA_ARGS[@]}" \
            scripts/pyinstaller_cli.py
          python -m PyInstaller --onefile --clean --name dfssvc \
            --add-data "dfs/i18n/catalogs.json${DATA_SEP}dfs/i18n" \
            "${EXTRA_ARGS[@]}" \
            scripts/pyinstaller_svc.py
          "./dist/dfs${{ matrix.ext }}" --help >/dev/null
          "./dist/dfscli${{ matrix.ext }}" --help >/dev/null
          "./dist/dfssvc${{ matrix.ext }}" --help >/dev/null
          mkdir -p stage
          cp "dist/dfs${{ matrix.ext }}" "stage/dfs${{ matrix.ext }}"
          cp "dist/dfscli${{ matrix.ext }}" "stage/dfscli${{ matrix.ext }}"
          cp "dist/dfssvc${{ matrix.ext }}" "stage/dfssvc${{ matrix.ext }}"
          cp README.md LICENSE stage/

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="dfs-${{ steps.ver.outputs.tag }}-${{ matrix.target }}.tar.gz"
          tar -C stage -czf "${NAME}" .
          echo "asset=${NAME}" >> "$GITHUB_OUTPUT"
        id: pkg_unix

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "dfs-${{ steps.ver.outputs.tag }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "stage/*" -DestinationPath $name -Force
          "asset=$name" >> $env:GITHUB_OUTPUT
        id: pkg_win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dfs-*.tar.gz
            dfs-*.zip

  python-wheel:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build universal Python distributions
        run: |
          uv build --out-dir python-dist
          cp fastecdsa-overrides.txt python-dist/

      - name: Verify universal wheel
        shell: bash
        run: |
          WHEEL="$(find python-dist -maxdepth 1 -name 'dfs-*.whl' -print -quit)"
          test -n "$WHEEL"
          case "$WHEEL" in
            *-py3-none-any.whl) ;;
            *)
              echo "dfs must produce a platform-independent py3-none-any wheel: $WHEEL" >&2
              exit 1
              ;;
          esac
          unzip -l "$WHEEL" | grep -q 'dfs/i18n/catalogs.json'
          uv venv --python 3.12 .wheel-venv
          uv pip install \
            --python .wheel-venv/bin/python \
            --overrides fastecdsa-overrides.txt \
            "$WHEEL"
          DFS_LANG=fr .wheel-venv/bin/python -c 'from dfs.i18n import _; key="巻き戻しを検出しました（B6）"; assert _(key) != key'
          .wheel-venv/bin/dfs --help >/dev/null
          .wheel-venv/bin/dfscli --help >/dev/null
          .wheel-venv/bin/dfssvc --help >/dev/null

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.build_binaries
    needs: [build, python-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS and render Homebrew formula
        run: |
          cd artifacts
          sha256sum dfs-* fastecdsa-overrides.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

          SHA_DARWIN_ARM64=$(grep "darwin-arm64.tar.gz" SHA256SUMS.txt | awk '{print $1}')
          SHA_LINUX_X86_64=$(grep "linux-x86_64.tar.gz" SHA256SUMS.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "linux-arm64.tar.gz" SHA256SUMS.txt | awk '{print $1}')

          sed -e "s/__VERSION__/${{ steps.ver.outputs.version }}/g" \
              -e "s/__TAG__/${{ steps.ver.outputs.tag }}/g" \
              -e "s/__SHA_DARWIN_ARM64__/${SHA_DARWIN_ARM64}/g" \
              -e "s/__SHA_LINUX_X86_64__/${SHA_LINUX_X86_64}/g" \
              -e "s/__SHA_LINUX_ARM64__/${SHA_LINUX_ARM64}/g" \
              ../Formula/dfs.rb > dfs.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: artifacts/dfs.rb

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            artifacts/dfs-*
            artifacts/SHA256SUMS.txt
            artifacts/fastecdsa-overrides.txt
            artifacts/dfs.rb
          generate_release_notes: true

  wheel-release:
    name: Publish Python wheel
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && !inputs.build_binaries
    needs: python-wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: wheel-dist

      - name: Create checksums
        shell: bash
        run: |
          cd wheel-dist
          sha256sum dfs-*.whl fastecdsa-overrides.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Python wheel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            wheel-dist/dfs-*.whl
            wheel-dist/fastecdsa-overrides.txt
            wheel-dist/SHA256SUMS.txt
          generate_release_notes: true
