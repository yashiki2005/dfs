name: Build fastecdsa macOS wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the wheel release"
        required: true
        default: "wheels-fastecdsa-2.3.2-cp313-macos"
        type: string
      publish_release:
        description: "Attach the wheels to a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: CPython 3.13 / macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            deployment_target: "15.0"
          - os: macos-15
            arch: arm64
            deployment_target: "15.0"

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GMP build dependency
        run: |
          brew install gmp
          echo "CFLAGS=-I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

      - name: Check build host
        shell: bash
        run: |
          python - <<'PY'
          import platform
          import sys

          print("python", sys.version)
          print("machine", platform.machine())
          print("platform", platform.platform())
          PY
          test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.arch }}"

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build delocate wheel
          python -m pip download \
            --no-deps \
            --no-binary=fastecdsa \
            --dest source \
            "fastecdsa==2.3.2"
          echo "f35255a6d3e41109166b5d4b08866d5acbb99f2e1e64d3a7e74c774664cda842  source/fastecdsa-2.3.2.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf source/fastecdsa-2.3.2.tar.gz -C source
          python -m build --wheel --outdir raw-wheelhouse source/fastecdsa-2.3.2
          mkdir -p relocated-wheelhouse wheelhouse
          delocate-wheel \
            --require-archs "${{ matrix.arch }}" \
            --wheel-dir relocated-wheelhouse \
            raw-wheelhouse/*.whl
          python -m wheel unpack relocated-wheelhouse/*.whl --dest unpacked
          GMP_PREFIX="$(brew --prefix gmp)"
          cp "$GMP_PREFIX/COPYING" unpacked/fastecdsa-2.3.2/fastecdsa/.dylibs/
          cp "$GMP_PREFIX/COPYING.LESSERv3" unpacked/fastecdsa-2.3.2/fastecdsa/.dylibs/
          cat > unpacked/fastecdsa-2.3.2/fastecdsa/.dylibs/GMP-NOTICE.txt <<EOF
          This wheel bundles an unmodified libgmp shared library.

          GMP is licensed under LGPL-3.0-or-later or GPL-2.0-or-later.
          See COPYING and COPYING.LESSERv3 in this directory.

          GMP source: https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz
          GMP project: https://gmplib.org/
          EOF
          python -m wheel pack unpacked/fastecdsa-2.3.2 --dest-dir wheelhouse
          WHEEL="$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          case "$WHEEL" in
            *cp313*"${{ matrix.arch }}"*.whl) ;;
            *)
              echo "Unexpected wheel tag: $WHEEL" >&2
              exit 1
              ;;
          esac
          unzip -l "$WHEEL" | grep -q 'libgmp.*\\.dylib'
          unzip -l "$WHEEL" | grep -q 'COPYING.LESSERv3'
          shasum -a 256 "$WHEEL" > "$WHEEL.sha256"
          cat "$WHEEL.sha256"

      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          NATIVE_MODULE="$(python -c 'import fastecdsa.curvemath as module; print(module.__file__)')"
          otool -L "$NATIVE_MODULE"
          test -f "$(dirname "$NATIVE_MODULE")/.dylibs/libgmp.10.dylib"
          if otool -L "$NATIVE_MODULE" | grep -Eq '/(opt/homebrew|usr/local)/'; then
            echo "Wheel still references a Homebrew or /usr/local library" >&2
            exit 1
          fi
          python - <<'PY'
          from fastecdsa import curve, ecdsa, keys

          private_key, public_key = keys.gen_keypair(curve.P256)
          message = b"dfs fastecdsa wheel smoke test"
          signature = ecdsa.sign(message, private_key, curve=curve.P256)
          assert ecdsa.verify(signature, message, public_key, curve=curve.P256)
          print("fastecdsa native extension: OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fastecdsa-2.3.2-cp313-macos-${{ matrix.arch }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish wheel release
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify downloaded wheels
        shell: bash
        run: |
          find dist -maxdepth 1 -name '*.whl' -print
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = "2"
          cd dist
          sha256sum *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "fastecdsa 2.3.2 macOS wheels (CPython 3.13)"
          body: |
            Prebuilt `fastecdsa==2.3.2` wheels for macOS and CPython 3.13.

            These wheels are provided because `libp2p 0.8.1` pins
            `fastecdsa==2.3.2`, but that release has no CPython 3.13 macOS
            wheels. GMP is bundled into each wheel so users do not need a
            separate Homebrew installation. Both Apple Silicon (`arm64`) and
            Intel (`x86_64`) wheels target macOS 15 or newer and are tested by
            the publishing workflow before release.

            The bundled GMP library is licensed under LGPL-3.0-or-later or
            GPL-2.0-or-later. Its license texts and source location are
            included in each wheel.

            Install the wheel matching the host architecture, then install
            `dfs`:

            ```bash
            python -m pip install /path/to/fastecdsa-2.3.2-cp313-cp313-macosx_*.whl
            python -m pip install dfs
            ```
          files: |
            dist/*.whl
            dist/SHA256SUMS.txt
          prerelease: true
          make_latest: "false"
