[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs5"
dynamic = ["version"]
description = "Layered single-writer distributed file system"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "dnspython>=2.6",
]

[project.optional-dependencies]
libp2p = ["libp2p>=0.8"]
test = ["pytest>=8"]

[project.scripts]
dfs5cli = "dfs5.cli_main:main"
dfs5svc = "dfs5.svc:main"

[tool.setuptools.packages.find]
include = ["dfs5*"]

[tool.setuptools.dynamic]
version = {attr = "dfs5.__version__"}
