[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs"
dynamic = ["version"]
description = "Layered single-writer distributed file system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "yashiki2005" },
]
dependencies = [
    "cryptography>=41",
    "dnspython>=2.6",
    "libp2p>=0.8",
    "zstandard>=0.22",
]

[project.optional-dependencies]
compression = ["zstandard>=0.22"]
libp2p = ["libp2p>=0.8"]
fuse = ["fusepy>=3"]
test = ["pytest>=8", "pytest-timeout>=2.3", "zstandard>=0.22"]

[project.scripts]
dfscli = "dfs.cli_main:main"
dfssvc = "dfs.svc:main"

[tool.setuptools.packages.find]
include = ["dfs*"]

[tool.setuptools.package-data]
"dfs.i18n" = ["catalogs.json"]

[tool.setuptools.dynamic]
version = {attr = "dfs.__version__"}

[project.urls]
Homepage = "https://github.com/yashiki2005/dfs"
Repository = "https://github.com/yashiki2005/dfs.git"
Issues = "https://github.com/yashiki2005/dfs/issues"
Security = "https://github.com/yashiki2005/dfs/security/policy"

[tool.pytest.ini_options]
testpaths = ["tests"]
