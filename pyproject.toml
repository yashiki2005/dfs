[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs"
dynamic = ["version"]
description = "Layered single-writer distributed file system"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "dnspython>=2.6",
    "libp2p>=0.8",
    "zstandard>=0.22",
]

[project.optional-dependencies]
compression = ["zstandard>=0.22"]
libp2p = ["libp2p>=0.8"]
fuse = ["fusepy>=3"]
test = ["pytest>=8", "zstandard>=0.22"]

[project.scripts]
dfscli = "dfs.cli_main:main"
dfssvc = "dfs.svc:main"

[tool.setuptools.packages.find]
include = ["dfs*"]

[tool.setuptools.dynamic]
version = {attr = "dfs.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
